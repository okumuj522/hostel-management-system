services:
  - type: web
    name: hostel-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    initialDeployHook: cd /app/hostel_system && python manage.py createsuperuser --noinput
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: hosteladmin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-management-db
          property: connectionString

databases:
  - name: hostel-management-db
    databaseName: hostel_management
    user: hostel_management
    plan: free
